# Python CI Pipeline
# Prerequisites: Python project with requirements.txt or pyproject.toml
# Customize: {{PYTHON_VERSIONS}}, {{LINT_COMMAND}}, {{TEST_COMMAND}}

name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - '*.py'
      - '**/*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install {{LINT_TOOLS}}
      - run: {{LINT_COMMAND}}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install mypy
      - run: mypy src/  # Remove this job if not type-checking

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: {{PYTHON_VERSIONS}}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt  # Remove if not separate
      - run: {{TEST_COMMAND}}
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
