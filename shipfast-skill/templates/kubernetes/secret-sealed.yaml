# SealedSecret Template (Bitnami Sealed Secrets)
# Prerequisites: Sealed Secrets controller installed in cluster
# Customize: {{APP_NAME}} and the encryptedData values
#
# Usage:
#   1. Create the original secret:
#      kubectl create secret generic my-app-secrets \
#        --from-literal=database-url=postgres://... \
#        --from-literal=api-key=sk-... \
#        --dry-run=client -o yaml > secret.yaml
#
#   2. Seal it:
#      kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
#   3. Delete secret.yaml (NEVER commit plain secrets)
#   4. Commit sealed-secret.yaml — safe to store in git
#
#   5. Apply: kubectl apply -f sealed-secret.yaml
#      The controller decrypts it and creates the Secret automatically.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{APP_NAME}}-secrets
  namespace: {{NAMESPACE}}
spec:
  encryptedData:
    database-url: {{ENCRYPTED_DATABASE_URL}}
    api-key: {{ENCRYPTED_API_KEY}}
    redis-password: {{ENCRYPTED_REDIS_PASSWORD}}
  template:
    metadata:
      name: {{APP_NAME}}-secrets
      labels:
        app: {{APP_NAME}}
